<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino DHT11 Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            backdrop-filter: blur(10px);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(to right, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-title {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 3em;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .card-unit {
            font-size: 1.2em;
            color: #667eea;
            text-align: center;
            display: block;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .last-update {
            color: #666;
            font-size: 0.9em;
        }

        .connection-status {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .connected {
            background: #d4edda;
            color: #155724;
        }

        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .chart-container {
            margin-top: 40px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .temperature-icon {
            color: #ff6b6b;
        }

        .humidity-icon {
            color: #4d96ff;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .card-value {
                font-size: 2.5em;
            }
        }
    </style>
    <!-- Include Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>🌡️ Arduino DHT11 Monitor</h1>
            <p class="subtitle">Real-time Temperature & Humidity via SIM800L</p>
        </header>

        <div class="dashboard">
            <div class="card">
                <div class="card-icon temperature-icon">🌡️</div>
                <h3 class="card-title">Temperature</h3>
                <div id="temperature" class="card-value">--.-</div>
                <span class="card-unit">°C</span>
                <div class="status">
                    <div class="last-update">Updated: <span id="temp-time">--:--:--</span></div>
                </div>
            </div>

            <div class="card">
                <div class="card-icon humidity-icon">💧</div>
                <h3 class="card-title">Humidity</h3>
                <div id="humidity" class="card-value">--</div>
                <span class="card-unit">% RH</span>
                <div class="status">
                    <div class="last-update">Updated: <span id="humidity-time">--:--:--</span></div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h3 style="color: #333; margin-bottom: 20px;">Historical Data (Last 10 Readings)</h3>
            <canvas id="sensorChart"></canvas>
        </div>

        <div class="status">
            <div class="last-update">
                <strong>Connection:</strong>
                <span id="connection-status" class="connection-status disconnected">Disconnected</span>
            </div>
            <div class="last-update">
                Last full update: <span id="last-update-time">Never</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="connectMQTT()">🔄 Connect</button>
            <button onclick="fetchData()">📡 Fetch Now</button>
            <button onclick="toggleAutoRefresh()" id="auto-refresh-btn">⏸️ Auto Refresh</button>
        </div>
    </div>

    <script>
        // MQTT Configuration
        const mqttConfig = {
            broker: 'wss://broker.hivemq.com:8884/mqtt',
            topic: 'arduino/dht11/data',
            clientId: 'web_client_' + Math.random().toString(16).substr(2, 8)
        };

        // Chart Configuration
        let sensorChart;
        let temperatureData = [];
        let humidityData = [];
        let timestampData = [];
        const maxDataPoints = 10;

        // Auto refresh state
        let autoRefresh = true;
        let refreshInterval;

        // Initialize MQTT Client
        const client = mqtt.connect(mqttConfig.broker, {
            clientId: mqttConfig.clientId,
            clean: true,
            reconnectPeriod: 1000,
            connectTimeout: 30 * 1000
        });

        // MQTT Event Handlers
        client.on('connect', () => {
            console.log('Connected to MQTT broker');
            updateConnectionStatus(true);
            client.subscribe(mqttConfig.topic, (err) => {
                if (!err) {
                    console.log(`Subscribed to ${mqttConfig.topic}`);
                }
            });
            startAutoRefresh();
        });

        client.on('message', (topic, message) => {
            if (topic === mqttConfig.topic) {
                processSensorData(JSON.parse(message.toString()));
            }
        });

        client.on('error', (err) => {
            console.error('MQTT Error:', err);
            updateConnectionStatus(false);
        });

        client.on('offline', () => {
            updateConnectionStatus(false);
        });

        // Process incoming sensor data
        function processSensorData(data) {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            const dateString = now.toLocaleDateString() + ' ' + timeString;

            // Update temperature display
            document.getElementById('temperature').textContent = data.temperature.toFixed(1);
            document.getElementById('temp-time').textContent = timeString;

            // Update humidity display
            document.getElementById('humidity').textContent = Math.round(data.humidity);
            document.getElementById('humidity-time').textContent = timeString;

            // Update last update time
            document.getElementById('last-update-time').textContent = dateString;

            // Add to historical data arrays
            addToChartData(data.temperature, data.humidity, timeString);

            // Update chart
            updateChart();

            // Log for debugging
            console.log(`Received: ${data.temperature}°C, ${data.humidity}% at ${data.timestamp}`);
        }

        // Initialize Chart
        function initChart() {
            const ctx = document.getElementById('sensorChart').getContext('2d');
            sensorChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timestampData,
                    datasets: [
                        {
                            label: 'Temperature (°C)',
                            data: temperatureData,
                            borderColor: '#ff6b6b',
                            backgroundColor: 'rgba(255, 107, 107, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Humidity (% RH)',
                            data: humidityData,
                            borderColor: '#4d96ff',
                            backgroundColor: 'rgba(77, 150, 255, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Time'
                            }
                        },
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Value'
                            }
                        }
                    }
                }
            });
        }

        // Add data to chart arrays
        function addToChartData(temp, hum, time) {
            temperatureData.push(temp);
            humidityData.push(hum);
            timestampData.push(time);

            // Keep only last N data points
            if (temperatureData.length > maxDataPoints) {
                temperatureData.shift();
                humidityData.shift();
                timestampData.shift();
            }
        }

        // Update chart
        function updateChart() {
            if (sensorChart) {
                sensorChart.update();
            }
        }

        // Update connection status UI
        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connection-status');
            if (connected) {
                statusElement.textContent = 'Connected';
                statusElement.className = 'connection-status connected';
            } else {
                statusElement.textContent = 'Disconnected';
                statusElement.className = 'connection-status disconnected';
            }
        }

        // Manual fetch data
        function fetchData() {
            // In a real implementation, you might make an HTTP request to your server
            console.log('Manual fetch requested');
            // For demo, we'll just show current time
            const now = new Date();
            document.getElementById('last-update-time').textContent = now.toLocaleString();
        }

        // Toggle auto-refresh
        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('auto-refresh-btn');

            if (autoRefresh) {
                startAutoRefresh();
                btn.textContent = '⏸️ Auto Refresh';
                btn.style.background = 'linear-gradient(to right, #667eea, #764ba2)';
            } else {
                stopAutoRefresh();
                btn.textContent = '▶️ Auto Refresh';
                btn.style.background = 'linear-gradient(to right, #4CAF50, #45a049)';
            }
        }

        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                if (client.connected) {
                    // You could publish a request message here if needed
                    console.log('Auto-refreshing...');
                }
            }, 10000); // Every 10 seconds
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        }

        // Manual MQTT connect
        window.connectMQTT = function () {
            if (!client.connected) {
                client.reconnect();
            }
        };

        // Initialize everything when page loads
        window.onload = function () {
            initChart();

            // Add some initial dummy data for the chart
            const now = new Date();
            for (let i = 9; i >= 0; i--) {
                const time = new Date(now.getTime() - i * 60000);
                addToChartData(
                    20 + Math.random() * 5, // Random temp between 20-25
                    40 + Math.random() * 20, // Random humidity between 40-60
                    time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                );
            }
            updateChart();
        };

        // Cleanup on page unload
        window.onbeforeunload = function () {
            if (client) {
                client.end();
            }
            stopAutoRefresh();
        };
    </script>
</body>

</html>
